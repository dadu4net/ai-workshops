      --tx: #FFFFFF;

      --ac2: #16223F;

      --glass-border: rgba(22, 34, 63, 0.8);

    --bg: #070D1B;
    --card: #0B1328;
    --tx: #FFFFFF;
    --mu: #94A3B8;
    --ac: var(--color-sky);

    --glass-bg: rgba(11, 19, 40, 0.85);

  html { scroll-padding-top: calc(env(safe-area-inset-top,0px) + 70px); }

  body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--font-primary); font-size: 16px; line-height: 1.5; }

  [data-theme="dark"] :focus-visible { outline: 2px solid var(--color-cyan); }

  /* Noppa Header & Glassmorphism */
  header { position: sticky; top: env(safe-area-inset-top,0px); z-index: 5; background: var(--glass-bg) !important; backdrop-filter: var(--glass-blur) !important; border-bottom: 1px solid var(--glass-border) !important; padding: 10px 16px; }

  /* Progress Bar */
  .bar { height: 8px; background: var(--bd); border-radius: 6px; overflow: hidden; margin-bottom:4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .pt { font-size: .8rem; color: var(--mu); }

  .card.done h3 { color: var(--color-cyan); }
  .sub, .meta, .mut { color: var(--mu); font-size: .9rem; margin: 0 0 10px; }
  
  /* Buttons & Forms */
  .btn { display: inline-block; margin: 4px 6px 0 0; padding: 6px 14px; border-radius: 8px; background: var(--ac); color: #fff; text-decoration: none; font-size: .85rem; border: 0; cursor: pointer; font-family: inherit; font-weight: 500; }
  .btn.g, .btn.s { background: var(--ac2); color: var(--ac); }
  textarea, input[type=text], select { width: 100%; padding: 10px; border: 1px solid var(--bd); border-radius: 8px; background: var(--bg); color: var(--tx); font: inherit; font-size: .92rem; margin-top: 4px; }
  textarea { min-height: 84px; resize: vertical; }
  label.l, .rl { display: block; font-size: .9rem; color: var(--tx); margin: 12px 0 4px; font-weight: 600; }
  label.ck, label:not(.l):not(.rl) { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; margin: 8px 0; font-size: .95rem; }
  label input[type="checkbox"] { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--ok); }
  
  /* Structural Helpers */
  .st { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--bd); }
  .st:first-of-type { border-top: 0; }
  .st input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--ok); }
  .st.done span.t { color: var(--mu); text-decoration: line-through; }
  .st div { flex: 1; }
  
  /* Tables */
  .sc, .tw { overflow-x: auto; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { border: 1px solid var(--bd); padding: 8px; text-align: left; vertical-align: top; }
  th { background: var(--ac2); color: var(--color-navy); font-weight: 600; }
  [data-theme="dark"] th { color: #fff; }
  
  /* Text / Code / Feedback */
  pre { background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: .85rem; margin: 6px 0; }
  .pr { background: var(--ac2); border-left: 4px solid var(--color-cyan); padding: 12px; margin: 12px 0; border-radius: 0 8px 8px 0; }
  .pr code { font-family: monospace; font-size: 0.9em; display: block; margin-bottom: 8px; white-space: pre-wrap; }
  .tip, .note { background: var(--ac2); border-radius: 8px; padding: 10px 12px; font-size: .9rem; margin: 12px 0; border-left: 4px solid var(--color-cyan); }
  
  /* Extended Classes for specific workshops */
  .tag { display: inline-block; background: var(--color-royal); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; }

  .o { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .o button { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--color-royal); background: transparent; cursor: pointer; color: var(--color-royal); font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
  .o button:hover { background: var(--ac2); }
  .o button.on { background: var(--color-royal); color: #fff; }
  [data-theme="dark"] .o button { border-color: var(--color-cyan); color: var(--color-cyan); }
  [data-theme="dark"] .o button.on { background: var(--color-cyan); color: #000; }
  
  .fb { margin-top: 8px; font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; display: inline-block; }

  .foot { color: var(--mu); font-size: .8rem; text-align: center; margin: 32px 0; }
  
  .mod { margin-bottom: 32px; }
  .mh { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--bd); padding-bottom: 8px; margin-bottom: 16px; }
  .apps { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  
  details { border-top: 1px solid var(--bd); padding: 12px 0; }

  /* Footer Component */
  footer { color: var(--mu); font-size: .85rem; border-top: 1px solid var(--bd); padding: 24px 0; margin-top: 40px; }
  
  /* Index card-links */
  .card-link { display: block; padding: 20px; margin-bottom: 16px; border: 1px solid var(--bd); border-radius: 12px; text-decoration: none; color: var(--tx); transition: transform 0.2s, box-shadow 0.2s; background: var(--card); }

  .card-link strong { display: block; font-size: 1.15rem; color: var(--color-royal); margin-bottom: 6px; }
  [data-theme="dark"] .card-link strong { color: var(--color-cyan); }

  .artikel-prose p { margin-bottom: 16px; }
  .artikel-prose ul, .artikel-prose ol { padding-left: 24px; margin-bottom: 16px; }

  .artikel-prose code { background: var(--ac2); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: monospace; }
</style>
</head>

  if(b.k=="app")h+='<div>'+b.a.map(function(a){return '<a class="btn" target="_blank" rel="noopener" href="'+APPS[a][1]+'">Open '+APPS[a][0]+' ↗</a>'}).join("")+'</div>';
  if(b.k=="chk")h+='<div class="card"><h3 style="margin-top:0">'+esc(b.h)+'</h3>'+b.i.map(function(t,i){return '<label class="ck"><input type="checkbox" data-k="'+p+"-"+i+'"><span>'+esc(t)+'</span></label>'}).join("")+'</div>';
  if(b.k=="pr")h+='<h3>'+esc(b.h)+'</h3>'+b.i.map(function(t){return '<div class="pr">'+esc(t)+'<br><button class="btn s cp" data-t="'+esc(t)+'">Kopieer</button></div>'}).join("");
  if(b.k=="ta")h+='<h3>'+esc(b.h)+'</h3><textarea data-n="'+b.id+'" placeholder="Typ hier je notitie"></textarea>';
  if(b.k=="tb")h+='<h3>'+esc(b.h)+'</h3><div class="tw"><table>'+b.r.map(function(r,i){var c=i?"td":"th";return '<tr>'+r.map(function(x){return '<'+c+'>'+esc(x)+'</'+c+'>'}).join("")+'</tr>'}).join("")+'</table></div>';
 });
 h+='</section>';
});
document.getElementById("main").innerHTML=h;document.getElementById("nav").innerHTML=nv;
var boxes=[].slice.call(document.querySelectorAll("input[data-k]"));
boxes.forEach(function(x){x.checked=!!st[x.dataset.k]});
[].forEach.call(document.querySelectorAll("textarea"),function(t){t.value=st["n:"+t.dataset.n]||""});
function upd(){
 var tot=boxes.length,d=boxes.filter(function(x){return x.checked}).length;
 document.getElementById("pb").style.width=(tot?100*d/tot:0)+"%";
 document.getElementById("pt").textContent=d+" / "+tot+" afgevinkt";
 S.forEach(function(s){
  var bs=boxes.filter(function(x){return x.dataset.k.indexOf(s.id+"-")==0}),dn=bs.filter(function(x){return x.checked}).length;
  var c=document.querySelector('[data-c="'+s.id+'"]');if(c)c.textContent=bs.length?dn+" / "+bs.length:"";
  var a=document.querySelector('nav a[data-s="'+s.id+'"]');if(a)a.classList.toggle("done",bs.length>0&&dn==bs.length);
 });
}
document.addEventListener("change",function(e){var x=e.target;if(x.dataset&&x.dataset.k){st[x.dataset.k]=x.checked;save();upd()}});

 if(x.classList.contains("cp")){var t=x.dataset.t;try{navigator.clipboard.writeText(t).then(function(){x.textContent="Gekopieerd ✓"},function(){x.textContent="Selecteer en kopieer handmatig"})}catch(err){x.textContent="Selecteer en kopieer handmatig"}setTimeout(function(){x.textContent="Kopieer"},1800)}
});
document.getElementById("reset").onclick=function(){if(confirm("Alle afvinkingen en notities wissen?")){st={};save();boxes.forEach(function(x){x.checked=false});[].forEach.call(document.querySelectorAll("textarea"),function(t){t.value=""});upd()}};
