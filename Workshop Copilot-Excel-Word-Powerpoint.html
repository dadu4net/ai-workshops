 {t:'Presentatie uit Word-document',m:'10 min',p:[[``,`Maak een presentatie van maximaal 6 slides op basis van het document 'voorstel-zonneveld-<jouwnaam>'. Doel: het bestuur van de VvE overtuigen om het voorstel te bespreken op de ledenvergadering. Publiek: niet-technische eigenaren-bewoners. Gebruik de huisstijl van deze presentatie. Houd per slide maximaal 4 bulletpoints of gebruik een visueel element. Geen verzonnen cijfers.`]],s:[`Plak de prompt en kies je Word-voorstel als bron (typ /)`,`Beoordeel elke slide: verhaallijn, te veel tekst, cijfers correct? Geef een kleur 🟢🟠🔴`,`Verwijder of herschrijf minimaal één slide`]},

 {t:'Sprekersnotities en kritische review',m:'7 min',p:[[`Sprekersnotities`,`Voeg bij elke slide sprekersnotities toe voor een presentatie van 1 minuut per slide. Schrijf in spreektaal en gebruik alleen informatie uit de slides en het voorstel.`],[`Kritische review`,`Je bent een kritisch bestuurslid van de VvE. Welke 5 vragen of bezwaren zou je na deze presentatie stellen? Wat ontbreekt er in mijn verhaal?`]],s:[`Plak de prompt voor sprekersnotities`,`Plak de prompt voor de kritische review`,`Kies de twee beste vragen en pas je presentatie of notities aan`]},
 {t:'Cijfers controleren',m:'4 min',s:[`Vergelijk elk bedrag, percentage en jaartal op je slides met het Word-voorstel en de notities`,`Bonus: plak de grafiek uit Excel op een slide en controleer of de cijfers overeenkomen`]}]}];

const REF=[['Excel','Data samenvatten · tekst classificeren · formules uitleggen · draaitabel en grafiek','Totalen · voorspellingen · interpretatie · rommelige data','Enige bron voor audit-cijfers · beslissingen over personen · gevoelige data buiten beleid'],['Word','Eerste concept · herschrijven · samenvatten · tabel uit tekst','Feiten en cijfers · externe documenten · vak buiten eigen kennis','Contracten zonder jurist · gevoelige persoonlijke berichten · vertrouwelijke data buiten beleid'],['PowerPoint','Deck uit document · slide visueler · sprekersnotities · kritische vragen','Cijfers en bronnen · titels · afbeeldingen · huisstijl','Strategie uitbesteden · niet doornemen vóór presenteren · vertrouwelijke info buiten beleid']];
const LIB=[`Stel me eerst drie vragen die je nodig hebt om dit goed te doen, voordat je begint.`,`Geef drie varianten: kort, gemiddeld en uitgebreid.`,`Wat mis je nog in dit resultaat? Waar heb je aannames gedaan?`,`Welke 3 dingen vallen op in deze tabel? Gebruik alleen de gegevens in de tabel.`,`Voeg een kolom toe die [criterium] bepaalt voor elke rij. Leg uit welke regels je gebruikt.`,`Markeer in rood alle rijen waar [voorwaarde].`,`Schrijf een [type document] voor [doelgroep] op basis van de tekst hieronder. Gebruik alleen deze informatie. Maximaal [lengte]. Toon: [toon].`,`Herschrijf deze alinea korter en duidelijker, behoud alle feiten.`,`Vat dit document samen in 5 punten en geef de acties met eigenaar en termijn.`,`Maak een presentatie van maximaal [aantal] slides op basis van [document]. Doel: [doel]. Publiek: [publiek]. Gebruik de huisstijl.`,`Welke vragen of bezwaren zou [rol] hebben na deze presentatie? Wat ontbreekt?`];
const FIX=[['Geen Copilot-pictogram','Bestand in OneDrive of SharePoint? AutoOpslaan aan? Office bijgewerkt? Licentie toegewezen? Vraag de trainer.'],['Copilot ziet de Excel-data niet','Maak er een tabel van (Ctrl+T), geen lege rijen of kolommen, kopteksten aanwezig.'],['Copilot geeft alleen tekst','Staat in Chat-modus: kies bewerken toestaan of Agent-modus, of je beheerder heeft het uitgezet.'],['Resultaat te algemeen','Voeg context en bron toe en stuur bij met een concrete vervolgvraag.'],['Ongewenste wijziging','Ongedaan maken (Ctrl+Z) of Bestand > Info > Versiegeschiedenis.']];

const T=[];let S={};try{S=JSON.parse(localStorage.getItem('cws')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('cws',JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const reg=t=>T.push(t)-1;
const cpb=(t,l)=>`<button class="s" data-t="${reg(t)}" data-l="${l}">${l}</button>`;
const apps=a=>`<a class="b" href="${L[a][0]}" target="_blank" rel="noopener">Open ${N[a]} (web)</a><a class="b s" href="${L[a][1]}">Desktop-app</a><a class="b s" href="${CHAT}" target="_blank" rel="noopener">Copilot Chat</a>`;
const chk=(id,m,txt)=>`<li><label><input type="checkbox" data-id="${id}" data-m="${m}"><span>${esc(txt)}</span></label></li>`;
const col=(c,t,a)=>`<div class="col" style="border-color:var(--${c})"><b>${t}</b><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
const fld=(k,ph)=>`<input type="text" data-k="${k}" placeholder="${ph}">`;

let h=`<h2 id="start">Start</h2><p class="mut">Werk in je eigen tempo. Vink stappen af, kopieer prompts met één klik en open de app via de knoppen. Je voortgang blijft bewaard in deze browser.</p>
<div class="op"><h3>Voorbereiding</h3><ul class="st">${['Bestanden staan in OneDrive of SharePoint, AutoOpslaan staat aan','Ik werk steeds op een eigen kopie','Ik zie het Copilot-pictogram (zo niet: meld het aan de trainer)'].map((x,i)=>chk('s0-'+i,'s',x)).join('')}</ul><a class="b" href="${CHAT}" target="_blank" rel="noopener">Open Copilot Chat</a></div>
<div class="op"><h3>De prompt-formule</h3><p><span class="chip">DOEL</span>wat moet er gebeuren?<br><span class="chip">CONTEXT</span>voor wie, waarom, welke situatie?<br><span class="chip">BRON</span>welke data, bestand of tekst?<br><span class="chip">VERWACHTING</span>formaat, lengte, toon</p>
<ul class="st">${chk('s1-0','s','Oefening: ik heb de prompt "Schrijf een e-mail aan een klant" verbeterd met de vier onderdelen')}</ul></div>
<div class="op"><h3>Gouden regels</h3><ul><li>Jij blijft verantwoordelijk: je naam staat eronder.</li><li>Controleer cijfers, namen, bronnen en regelgeving.</li><li>Houd je aan het beleid over welke informatie waar in mag.</li><li>Werk op een kopie als Copilot zelf bewerkt.</li><li>Gebruik Ongedaan maken en Versiegeschiedenis.</li></ul>
<div class="cols">${col('g','🟢 Groen',['Sterk in: steekproef volstaat'])}${col('o','🟠 Oranje',['Helpt, jij controleert aantoonbaar'])}${col('r','🔴 Rood',['Niet doen, of alleen via procedure'])}</div></div>`;
M.forEach(m=>{
 h+=`<h2 id="${m.id}">${m.naam} <span class="t">${m.tijd}</span></h2><p class="mut">${m.intro}</p><div>${apps(m.app)}</div>`;
 m.ops.forEach((o,i)=>{
  h+=`<section class="op"><h3>${i?'Opdracht '+i+' – ':''}${o.t}<span class="t">${o.m}</span></h3><ul class="st">${o.s.map((x,j)=>chk(m.id+i+'-'+j,m.id,x)).join('')}</ul>`;
  (o.p||[]).forEach(p=>{h+=`<div class="pr">${p[0]?`<small>${p[0]}</small>`:''}<pre>${esc(p[1])}</pre>${cpb(p[1],'Kopieer prompt')}</div>`});
  if(o.copy)h+=cpb(o.copy[0]=='data'?DATA:NOTES,o.copy[1]);
  (o.links||[]).forEach(l=>{h+=`<a class="b s" href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`});
  h+=`${apps(m.app)}</section>`;});
 h+=`<h3>Wanneer wel, wanneer niet: ${m.naam}</h3><div class="cols">${col('g','🟢 Wel',m.w)}${col('o','🟠 Met controle',m.o)}${col('r','🔴 Beter niet',m.n)}</div>`;});
h+=`<h2 id="a">Afsluiting</h2><div class="op"><h3>Mijn stoplichtkaart</h3><div class="tw"><table><tr><th>Mijn taak</th><th>Kleur</th><th>Prompt en controle</th></tr>${[1,2,3].map(i=>`<tr><td>${fld('t'+i,'Taak '+i)}</td><td><select data-k="c${i}"><option value="">–</option><option>🟢 Groen</option><option>🟠 Oranje</option><option>🔴 Rood</option></select></td><td>${fld('p'+i,'Hoe pak ik dit aan en controleer ik het?')}</td></tr>`).join('')}</table></div></div>
<div class="op"><h3>Mijn actie voor volgende week</h3><p class="mut">Volgende week gebruik ik Copilot in [app] om [taak] te doen. Ik controleer het resultaat door [manier].</p><textarea rows="3" data-k="actie"></textarea><ul class="st">${chk('a0','a','Ik heb deze actie in mijn agenda gezet')}</ul></div>
<h2 id="n">Naslag</h2><div class="op"><h3>Spiekbrief: wanneer wel, wanneer niet</h3><div class="tw"><table><tr><th></th><th>🟢 Wel</th><th>🟠 Met controle</th><th>🔴 Niet</th></tr>${REF.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div><p class="mut">Altijd: Doel – Context – Bron – Verwachting · werk op een kopie · controleer bij de bron · jij blijft verantwoordelijk.</p></div>
<div class="op"><h3>Promptbibliotheek</h3>${LIB.map(x=>`<div class="pr"><pre>${esc(x)}</pre>${cpb(x,'Kopieer prompt')}</div>`).join('')}</div>
<div class="op"><h3>Als iets niet werkt</h3><div class="tw"><table>${FIX.map(f=>`<tr><td><b>${f[0]}</b></td><td>${f[1]}</td></tr>`).join('')}</table></div></div>
<div class="op"><h3>Oefenmateriaal opnieuw kopiëren</h3>${cpb(DATA,'Kopieer data (Excel)')}${cpb(NOTES,'Kopieer notities (Word)')}</div>
<button class="reset" id="rs">Wis mijn voortgang</button>`;
document.getElementById('app').innerHTML=h;
const nm={s:'Start',x:'Excel',w:'Word',p:'PowerPoint',a:'Afsluiting'};
document.getElementById('nav').innerHTML=[['start','Start','s'],['x','Excel','x'],['w','Word','w'],['p','PowerPoint','p'],['a','Afsluiting','a'],['n','Naslag','']].map(n=>`<a href="#${n[0]}" data-n="${n[2]}">${n[1]}</a>`).join('');
const boxes=[...document.querySelectorAll('input[data-id]')];
boxes.forEach(b=>{b.checked=!!S[b.dataset.id]});
document.querySelectorAll('[data-k]').forEach(f=>{if(S['k'+f.dataset.k])f.value=S['k'+f.dataset.k]});
function upd(){const d=boxes.filter(b=>b.checked).length;document.getElementById('tot').textContent=d+'/'+boxes.length;document.getElementById('pb').style.width=(100*d/boxes.length)+'%';
 document.querySelectorAll('#nav a[data-n]').forEach(a=>{const k=a.dataset.n;if(!k)return;const g=boxes.filter(b=>b.dataset.m==k);const c=g.filter(b=>b.checked).length;a.textContent=nm[k]+' '+c+'/'+g.length+(c==g.length?' ✓':'')})}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.id){S[t.dataset.id]=t.checked||undefined;save();upd()}else if(t.dataset.k){S['k'+t.dataset.k]=t.value;save()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k){S['k'+t.dataset.k]=t.value;save()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-t]');if(!b)return;const txt=T[+b.dataset.t];let ok=false;
 try{await navigator.clipboard.writeText(txt);ok=true}catch(x){try{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove()}catch(y){}}
 b.textContent=ok?'Gekopieerd ✓':'Selecteer en kopieer zelf';setTimeout(()=>b.textContent=b.dataset.l,1800)});
document.getElementById('rs').onclick=()=>{if(confirm('Weet je zeker dat je al je voortgang wilt wissen?')){S={};save();location.reload()}};
upd();
</script>

      <a href="#" style="color: var(--tx); text-decoration: none;">Cookie Voorwaarden</a>
      <a href="#" style="color: var(--tx); text-decoration: none;">Toegankelijkheid</a>
    </div>
  </div>
</footer>
