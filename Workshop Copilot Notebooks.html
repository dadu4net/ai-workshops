<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop Copilot Notebooks</title>
<style>
  /* Noppa UX/UI CSS Injection - Unified Component Library */
  :root {
    --color-cyan: #00D0F0;
    --color-sky: #20B0F0;
    --color-royal: #2060E0;
    --color-indigo: #3A4FD0;
    --color-navy: #0F2A66;
    --color-ink: #1A2440;
    --color-slate: #6B7280;
    --color-mist: #E4E9F2;
    --color-light: #F1F5FB;

    --bg: var(--color-light);
    --card: #fff;
    --tx: var(--color-ink);
    --mu: var(--color-slate);
    --ac: var(--color-royal);
    --ac2: var(--color-mist);
    --bd: var(--color-mist);
    --ok: var(--color-cyan);
    --gradient-signature: linear-gradient(90deg, #00D0F0 0%, #20B0F0 30%, #2060E0 70%, #3A4FD0 100%);
    
    --glass-bg: rgba(255, 255, 255, 0.85);
    --glass-border: rgba(228, 233, 242, 0.8);
    --glass-blur: blur(20px);
    
    --font-primary: Kentledge, sans-serif, system-ui;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #070D1B;
      --card: #0B1328;
      --tx: #FFFFFF;
      --mu: #94A3B8;
      --ac: var(--color-sky);
      --ac2: #16223F;
      --bd: #16223F;
      --ok: var(--color-cyan);
      --glass-bg: rgba(11, 19, 40, 0.85);
      --glass-border: rgba(22, 34, 63, 0.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #070D1B;
    --card: #0B1328;
    --tx: #FFFFFF;
    --mu: #94A3B8;
    --ac: var(--color-sky);
    --ac2: #16223F;
    --bd: #16223F;
    --ok: var(--color-cyan);
    --glass-bg: rgba(11, 19, 40, 0.85);
    --glass-border: rgba(22, 34, 63, 0.8);
    color-scheme: dark;
  }
  
  html { scroll-padding-top: calc(env(safe-area-inset-top,0px) + 70px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--font-primary); font-size: 16px; line-height: 1.5; }
  
  /* WCAG Focus */
  :focus-visible { outline: 2px solid var(--color-royal); outline-offset: 2px; }
  [data-theme="dark"] :focus-visible { outline: 2px solid var(--color-cyan); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :focus-visible { outline: 2px solid var(--color-cyan); } }

  /* Noppa Header & Glassmorphism */
  header { position: sticky; top: env(safe-area-inset-top,0px); z-index: 5; background: var(--glass-bg) !important; backdrop-filter: var(--glass-blur) !important; border-bottom: 1px solid var(--glass-border) !important; padding: 10px 16px; }
  .w { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.05rem; margin: 0 0 6px; }
  h2 { font-size: 1.15rem; margin: 0 0 4px; color: var(--color-navy); }
  [data-theme="dark"] h2 { color: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h2 { color: #FFFFFF; } }
  
  /* Progress Bar */
  .bar { height: 8px; background: var(--bd); border-radius: 6px; overflow: hidden; margin-bottom:4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .pt { font-size: .8rem; color: var(--mu); }
  
  /* Shared Base App Layout */
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  nav a { font-size: .85rem; padding: 4px 10px; border-radius: 14px; background: var(--ac2); color: var(--ac); text-decoration: none; }
  nav a.done { opacity: 0.7; }
  section, .card { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 16px; margin: 16px 0; }
  .card.done h3 { color: var(--color-cyan); }
  .sub, .meta, .mut { color: var(--mu); font-size: .9rem; margin: 0 0 10px; }
  
  /* Buttons & Forms */
  .btn { display: inline-block; margin: 4px 6px 0 0; padding: 6px 14px; border-radius: 8px; background: var(--ac); color: #fff; text-decoration: none; font-size: .85rem; border: 0; cursor: pointer; font-family: inherit; font-weight: 500; }
  .btn.g, .btn.s { background: var(--ac2); color: var(--ac); }
  textarea, input[type=text], select { width: 100%; padding: 10px; border: 1px solid var(--bd); border-radius: 8px; background: var(--bg); color: var(--tx); font: inherit; font-size: .92rem; margin-top: 4px; }
  textarea { min-height: 84px; resize: vertical; }
  label.l, .rl { display: block; font-size: .9rem; color: var(--tx); margin: 12px 0 4px; font-weight: 600; }
  label.ck, label:not(.l):not(.rl) { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; margin: 8px 0; font-size: .95rem; }
  label input[type="checkbox"] { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--ok); }
  
  /* Structural Helpers */
  .st { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--bd); }
  .st:first-of-type { border-top: 0; }
  .st input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--ok); }
  .st.done span.t { color: var(--mu); text-decoration: line-through; }
  .st div { flex: 1; }
  
  /* Tables */
  .sc, .tw { overflow-x: auto; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { border: 1px solid var(--bd); padding: 8px; text-align: left; vertical-align: top; }
  th { background: var(--ac2); color: var(--color-navy); font-weight: 600; }
  [data-theme="dark"] th { color: #fff; }
  
  /* Text / Code / Feedback */
  pre { background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: .85rem; margin: 6px 0; }
  .pr { background: var(--ac2); border-left: 4px solid var(--color-cyan); padding: 12px; margin: 12px 0; border-radius: 0 8px 8px 0; }
  .pr code { font-family: monospace; font-size: 0.9em; display: block; margin-bottom: 8px; white-space: pre-wrap; }
  .tip, .note { background: var(--ac2); border-radius: 8px; padding: 10px 12px; font-size: .9rem; margin: 12px 0; border-left: 4px solid var(--color-cyan); }
  
  /* Extended Classes for specific workshops */
  .tag { display: inline-block; background: var(--color-royal); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; }
  .two { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media(min-width: 600px){ .two { grid-template-columns: 1fr 1fr; } }
  .q { background: var(--bg); border: 1px solid var(--bd); padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .o { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .o button { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--color-royal); background: transparent; cursor: pointer; color: var(--color-royal); font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
  .o button:hover { background: var(--ac2); }
  .o button.on { background: var(--color-royal); color: #fff; }
  [data-theme="dark"] .o button { border-color: var(--color-cyan); color: var(--color-cyan); }
  [data-theme="dark"] .o button.on { background: var(--color-cyan); color: #000; }
  
  .fb { margin-top: 8px; font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; display: inline-block; }
  .fb.ok { color: #fff; background: var(--color-cyan); }
  .fb.bad, .fb.no { color: #fff; background: #E11D48; } /* Warning Red */
  
  .foot { color: var(--mu); font-size: .8rem; text-align: center; margin: 32px 0; }
  
  .mod { margin-bottom: 32px; }
  .mh { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--bd); padding-bottom: 8px; margin-bottom: 16px; }
  .apps { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  
  details { border-top: 1px solid var(--bd); padding: 12px 0; }
  summary { cursor: pointer; font-weight: 600; font-size: 1.05rem; }
  
  /* Footer Component */
  footer { color: var(--mu); font-size: .85rem; border-top: 1px solid var(--bd); padding: 24px 0; margin-top: 40px; }
  
  /* Index card-links */
  .card-link { display: block; padding: 20px; margin-bottom: 16px; border: 1px solid var(--bd); border-radius: 12px; text-decoration: none; color: var(--tx); transition: transform 0.2s, box-shadow 0.2s; background: var(--card); }
  .card-link:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); border-color: var(--color-royal); }
  [data-theme="dark"] .card-link:hover { box-shadow: 0 6px 16px rgba(0,0,0,0.4); border-color: var(--color-cyan); }
  .card-link strong { display: block; font-size: 1.15rem; color: var(--color-royal); margin-bottom: 6px; }
  [data-theme="dark"] .card-link strong { color: var(--color-cyan); }
  
  /* .artikel-prose additions */
  .artikel-prose { line-height: 1.8; }
  .artikel-prose blockquote { border-left: 4px solid var(--color-cyan); background: var(--ac2); padding: 12px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
  .artikel-prose p { margin-bottom: 16px; }
  .artikel-prose ul, .artikel-prose ol { padding-left: 24px; margin-bottom: 16px; }
  .artikel-prose li { margin-bottom: 6px; }
  .artikel-prose code { background: var(--ac2); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: monospace; }
</style>
</head>
<body>
<header>
  <div class="w" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px;">
    <div>
      <h1 style="margin:0; font-family: Kentledge, sans-serif; background: var(--gradient-signature); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size:1.5rem;">Noppa Workshops</h1>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'" style="background:none; border:none; color:var(--tx); cursor:pointer;" aria-label="Toggle Theme">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
    </div>
  </div>
  <div class="w">
    <h2 style="font-size:1.15rem;margin:0 0 6px">Workshop Copilot Notebooks</h2>
    <div class="bar"><i id="pb"></i></div><div class="pt" id="pt"></div>
  </div>
</header>
<main id="m" class="w artikel-prose" style="padding:0 16px"></main>
<script>
const NB='https://m365.cloud.microsoft/notebooks';
const mem={};
function sg(k){if(k in mem)return mem[k];try{return localStorage.getItem('wsnb:'+k)}catch(e){return null}}
function ss(k,v){mem[k]=v;try{localStorage.setItem('wsnb:'+k,v)}catch(e){}}
const P=[];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const pr=t=>{P.push(t);return `<span class="pr">${esc(t)}<br><button class="btn s" data-p="${P.length-1}" style="margin-top:6px">Kopieer prompt</button></span>`};
const cta=()=>`<a class="btn" href="${NB}" target="_blank" rel="noopener">Open Copilot Notebooks ↗</a><div class="mut">Opent in een nieuw tabblad. Log in met je werkaccount. Niet zichtbaar? Kies <b>Notebooks</b> in de Microsoft 365 Copilot-app.</div>`;
const steps=(id,a)=>a.map((s,i)=>{const t=typeof s==='string'?s:s[0],p=typeof s==='string'?'':pr(s[1]);return `<div class="st"><input type="checkbox" id="${id}${i}" data-k="${id}${i}"><label for="${id}${i}">${t}${p}</label></div>`}).join('');
const note=(k,l)=>`<h3>${l}</h3><textarea data-n="${k}" placeholder="Typ hier je aantekening"></textarea>`;
const INSTR='Antwoord in het Nederlands, in heldere taal. Geef eerst de conclusie, daarna de onderbouwing in maximaal 5 punten. Noem altijd de bron. Als iets niet in de bronnen staat, zeg dat expliciet en verzin niets. Wijs op tegenstrijdigheden tussen bronnen.';
const SORT=[
['Dossier van 12 documenten, morgen advies schrijven','N','Veel bronnen, één onderwerp.'],
['Actuele btw-regels voor een specifieke dienst opzoeken','C','Actuele webinformatie hoort bij Chat.'],
['Nieuwe collega inwerken op een lopend project','N','Terugkerend vragen stellen aan dezelfde bronnen.'],
['Naam bedenken voor een interne nieuwsbrief','C','Brainstorm zonder bronnen.'],
['Totaalkosten in een Excel-model controleren op rekenfouten','A','Rekenwerk controleer je in Excel zelf.'],
['Bevindingen uit vijf evaluatierapporten naast elkaar zetten','N','Bronnen vergelijken.'],
['Vertrouwelijk HR-dossier samenvatten, nog geen afspraken over AI en HR-data','A','Eerst afspraken maken met IT en HR.'],
['E-mail vriendelijker herschrijven','C','Snelle taak, geen bronnen nodig (of Copilot in Outlook).']];
const sec=[];
sec.push(`<section id="v"><span class="tag">Start</span><h2>Voor je begint</h2><p class="mut">Vink af wat klaar is. Je voortgang blijft bewaard in deze browser.</p>${steps('v',['Ik kan inloggen op de Microsoft 365 Copilot-app','Ik zie Notebooks in het menu','Ik heb toegang tot de oefenmap "Project Nieuw Intranet" (je trainer deelt die)','Ik heb een eigen werksituatie bedacht met veel documenten (voor Opdracht 4)'])}${cta()}
<h3>De oefenmap</h3><table><tr><th>Bestand</th><th>Inhoud</th></tr><tr><td>Projectplan Nieuw Intranet</td><td>Doel, scope, planning, budget</td></tr><tr><td>Notulen stuurgroep januari</td><td>Besluiten en acties</td></tr><tr><td>Notulen stuurgroep februari</td><td>Besluiten en acties</td></tr><tr><td>Offerte leverancier A</td><td>Prijs en voorwaarden</td></tr><tr><td>Offerte leverancier B</td><td>Prijs en voorwaarden</td></tr><tr><td>Risicolijst</td><td>9 risico's met eigenaar en status</td></tr></table>
<h3>De prompt-formule</h3><p><b>Context + Taak + Vorm + Doelgroep</b><br><span class="mut">Voorbeeld: "Op basis van de stuurgroepnotulen, vat de besluiten samen in een tabel met actie en eigenaar, voor een nieuwe projectmedewerker."</span></p></section>`);
sec.push(`<section id="o1"><span class="tag">Opdracht 1 · 20 min</span><h2>Bouw je notebook</h2><p class="mut">Doel: een werkend notebook met 6 referenties en 4 bruikbare antwoorden.</p>${cta()}${steps('a',['Maak een nieuw notebook met de naam "Project Nieuw Intranet – [jouw naam]"','Voeg de 6 bestanden uit de oefenmap toe via Referentie toevoegen',['Vraag a','Vat het project samen in maximaal 5 zinnen: doel, planning en budget.'],['Vraag b','Welke besluiten zijn genomen in de stuurgroepen en wie heeft welke actie?'],['Vraag c','Vergelijk de twee offertes in een tabel: prijs, looptijd, voorwaarden en risico\'s.'],['Vraag d','Welke drie risico\'s zijn het meest urgent en waarom?'],'Klik bij minstens twee antwoorden de bronverwijzing aan en controleer of die klopt','Zet één bestand uit of verwijder het en stel vraag a opnieuw'])}${note('n1','Wat veranderde er toen je een bron wegliet?')}${note('n1b','Wat verschilt dit van gewone Copilot Chat?')}</section>`);
sec.push(`<section id="o2"><span class="tag">Opdracht 2 · 10 min</span><h2>Wanneer wel, wanneer niet?</h2><h3>Deel A: sorteer de situaties</h3><p class="mut">N = Notebook, C = Copilot Chat, A = iets anders of eerst afspraken maken.</p><div id="sort"></div><button class="btn" id="chk">Controleer mijn antwoorden</button> <span id="sc" class="mut"></span>
<h3>Deel B: test de grenzen in je notebook</h3>${cta()}${steps('b',[['Vraag naar iets dat niet in de bronnen staat. Wat doet Copilot?','Wat zijn de verwachte migratiekosten?'],['Vraag naar iets waarover bronnen elkaar tegenspreken. Merkt Copilot het?','Wanneer wordt het intranet opgeleverd?']])}${note('n2','Wat is je les hieruit?')}
<p><b>Vuistregel:</b> 3+ bronnen · één onderwerp · meerdere keren gebruiken → Notebook. Anders → Chat.</p></section>`);
sec.push(`<section id="o3"><span class="tag">Opdracht 3 · 17 min</span><h2>Instructies en een eindproduct</h2>${cta()}${steps('c',[['Stel notebook-instructies in. Je mag de standaardinstructie gebruiken en aanpassen.',INSTR],['Maak een statusupdate voor de directie','Schrijf een statusupdate voor de directie van maximaal 200 woorden over het project Nieuw Intranet. Neem op: stand van zaken, belangrijkste besluiten, top 3 risico\'s en de volgende stappen. Toon: zakelijk, kort, geen jargon.'],'Maak een tweede product naar keuze via Quick create: audio-overzicht, vragenlijst voor de stuurgroep of een concept-document','Controleer de bronnen en pas het resultaat aan met een vervolgvraag','Vergelijk je instructie met die van je buur'])}${note('n3','Wat moest je zelf nog aanpassen?')}${note('n3b','Welke instructie werkte het best?')}</section>`);
sec.push(`<section id="o4"><span class="tag">Opdracht 4 · 15 min</span><h2>Jouw eigen notebook</h2><p class="mut">Geen eigen casus? Bouw een notebook voor je eigen onboarding. Gebruik alleen materiaal dat in je eigen omgeving thuishoort.</p>${cta()}${steps('d',['Kies je eigen werksituatie en maak een notebook met een duidelijke naam','Voeg minimaal 3 echte referenties toe','Stel instructies in','Stel 3 vragen die je echt nodig hebt','Deel je resultaat in 60 seconden met de groep (als je wordt gevraagd)'])}${note('n4','Wat werkte? Wat werkte niet?')}</section>`);
sec.push(`<section id="af"><span class="tag">Afsluiting</span><h2>Mijn actieplan</h2>${steps('e',['Binnen 3 dagen: mijn eigen notebook voor een lopend project afmaken','Binnen 1 week: een collega laten zien wat ik heb gebouwd','Binnen 2 weken: mijn instructies verfijnen en delen met het team'])}${note('n5','Mijn belangrijkste inzicht')}${note('n5b','Dit heb ik nog nodig')}</section>`);
sec.push(`<section id="nl"><span class="tag">Naslag</span><h2>Cheatsheet</h2><div class="two"><div><b>Wel Notebook</b><ul><li>Veel bronnen, één onderwerp</li><li>Bronnen vergelijken</li><li>Terugkerend vragen stellen</li><li>Concept maken van bestaand materiaal</li></ul></div><div><b>Liever iets anders</b><ul><li>Snelle losse vraag: Chat</li><li>Actuele webinformatie</li><li>Exacte berekeningen: Excel</li><li>Gevoelige data zonder afspraken</li></ul></div></div>
<h3>Standaardinstructie</h3>${pr(INSTR)}<h3>Handige prompts</h3>${['Vat dit notebook samen in 5 zinnen voor iemand die het project niet kent.','Zijn er tegenstrijdigheden tussen de bronnen? Zet ze in een tabel.','Welke informatie ontbreekt nog om een besluit te kunnen nemen?','Welke 5 vragen zou een nieuwe collega stellen? Beantwoord ze.'].map(pr).join('')}
<h3>Controleer altijd</h3><ul><li>Klopt het antwoord met de bron? Klik de verwijzing aan.</li><li>Staat alles erin, of mist er iets?</li><li>Mag deze informatie in het notebook en mag ik het delen?</li></ul>
<p><button class="btn s" id="rs">Wis mijn voortgang</button></p></section><p class="foot">Oefenmateriaal is fictief. Knopnamen in Copilot kunnen afwijken; vraag het je trainer.</p>`);
document.getElementById('m').innerHTML=sec.join('');
// sorteren
const sd=document.getElementById('sort');let S={};try{S=JSON.parse(sg('sort')||'{}')}catch(e){}
sd.innerHTML=SORT.map((r,i)=>`<div class="q"><b>${i+1}</b>${r[0]}<div class="o">${['N','C','A'].map(l=>`<button data-i="${i}" data-l="${l}">${l}</button>`).join('')}</div><div class="fb" id="f${i}"></div></div>`).join('');
function paintS(){sd.querySelectorAll('.o button').forEach(b=>b.classList.toggle('on',S[b.dataset.i]===b.dataset.l))}
paintS();
sd.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[b.dataset.i]=b.dataset.l;ss('sort',JSON.stringify(S));paintS()};
document.getElementById('chk').onclick=()=>{let ok=0,n=0;SORT.forEach((r,i)=>{const f=document.getElementById('f'+i);if(!S[i]){f.textContent='';return}n++;const g=S[i]===r[1];if(g)ok++;f.className='fb '+(g?'ok':'bad');f.textContent=(g?'Goed. ':'Juiste antwoord: '+r[1]+'. ')+r[2]});document.getElementById('sc').textContent=n<SORT.length?'Beantwoord eerst alle situaties ('+n+'/'+SORT.length+')':ok+' van '+SORT.length+' goed'};
// afvinken, notities, voortgang
const cbs=[...document.querySelectorAll('input[data-k]')];
function prog(){const d=cbs.filter(c=>c.checked).length,p=Math.round(100*d/cbs.length);document.getElementById('pb').style.width=p+'%';document.getElementById('pl').textContent=p+'% afgerond ('+d+' van '+cbs.length+')'}
cbs.forEach(c=>{c.checked=sg(c.dataset.k)==='1';c.onchange=()=>{ss(c.dataset.k,c.checked?'1':'0');prog()}});prog();
document.querySelectorAll('textarea[data-n]').forEach(t=>{t.value=sg('t'+t.dataset.n)||'';t.oninput=()=>ss('t'+t.dataset.n,t.value)});
// kopieren
document.getElementById('m').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;const t=P[b.dataset.p],old=b.textContent;const done=()=>{b.textContent='Gekopieerd ✓';setTimeout(()=>b.textContent=old,1500)};
const fb=()=>{try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}catch(x){b.textContent='Selecteer en kopieer zelf'}};
try{navigator.clipboard.writeText(t).then(done,fb)}catch(x){fb()}});
